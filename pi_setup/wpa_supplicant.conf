country=IN
ctrl_interface=DIR=/var/run/wpa_supplicant GROUP=netdev
update_config=1
ap_scan=1

# ── Single network block for "Nitro" hotspot ────────────────
# Both laptop and phone hotspot use the same SSID + password.
# wpa_supplicant picks the stronger signal automatically.
# If your phone hotspot has a DIFFERENT SSID/password, add a
# second block below with bssid= set to the phone's MAC address.
network={
    ssid="IOTDEVICE"
    psk="12345678"
    key_mgmt=WPA-PSK
    priority=10
    # bgscan: actively scan for better AP every 30s (min), 300s (max)
    # NOTE: commented out because background scanning can crash the Pi 4 Cypress WiFi driver/firmware.
    # The watchdog handles reassociation much more reliably.
    # bgscan="simple:30:-65:300"
}
